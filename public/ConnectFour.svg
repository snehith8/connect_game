<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </radialGradient>

    <!-- Blue Stand Front Gradient -->
    <linearGradient id="boardFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Blue Stand Bevel/Legs -->
    <linearGradient id="boardLegs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <!-- Red Token 3D Gradient -->
    <radialGradient id="redToken" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fca5a5" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </radialGradient>

    <!-- Yellow Token 3D Gradient -->
    <radialGradient id="yellowToken" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>

    <!-- Empty Slot Shadow Gradient -->
    <radialGradient id="emptySlot" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="90%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Soft Drop Shadow for Board -->
    <filter id="boardShadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>

    <!-- Token Glow / Shadow -->
    <filter id="tokenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <rect width="800" height="600" rx="32" fill="url(#bgGlow)" />

  <!-- Ground Floor Shadow -->
  <ellipse cx="400" cy="510" rx="310" ry="22" fill="#0f172a" opacity="0.14" />

  <!-- Left & Right Board Feet -->
  <path d="M 120 480 L 160 360 L 210 490 L 175 510 L 105 510 Z" fill="url(#boardLegs)" opacity="0.9" />
  <path d="M 680 480 L 640 360 L 590 490 L 625 510 L 695 510 Z" fill="url(#boardLegs)" opacity="0.9" />

  <!-- Main Connect Four Blue Board Frame -->
  <g filter="url(#boardShadow)">
    <rect x="140" y="110" width="520" height="380" rx="28" fill="url(#boardFront)" />
    <!-- Top Entry Guide Lip -->
    <rect x="150" y="118" width="500" height="12" rx="6" fill="#60a5fa" opacity="0.4" />
  </g>

  <!-- Grid Holes & Tokens -->
  <!-- Row 5 (Bottom) -->
  <circle cx="190" cy="440" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />
  <circle cx="260" cy="440" r="28" fill="url(#yellowToken)" filter="url(#tokenShadow)" />
  <circle cx="330" cy="440" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />
  <circle cx="400" cy="440" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />
  <circle cx="470" cy="440" r="28" fill="url(#yellowToken)" filter="url(#tokenShadow)" />
  <circle cx="540" cy="440" r="28" fill="url(#yellowToken)" filter="url(#tokenShadow)" />
  <circle cx="610" cy="440" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />

  <!-- Row 4 -->
  <circle cx="190" cy="380" r="28" fill="url(#yellowToken)" filter="url(#tokenShadow)" />
  <circle cx="260" cy="380" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />
  <circle cx="330" cy="380" r="28" fill="url(#yellowToken)" filter="url(#tokenShadow)" />
  <circle cx="400" cy="380" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />
  <circle cx="470" cy="380" r="28" fill="url(#emptySlot)" />
  <circle cx="540" cy="380" r="28" fill="url(#yellowToken)" filter="url(#tokenShadow)" />
  <circle cx="610" cy="380" r="28" fill="url(#emptySlot)" />

  <!-- Row 3 -->
  <circle cx="190" cy="320" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />
  <circle cx="260" cy="320" r="28" fill="url(#yellowToken)" filter="url(#tokenShadow)" />
  <circle cx="330" cy="320" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />
  <circle cx="400" cy="320" r="28" fill="url(#emptySlot)" />
  <circle cx="470" cy="320" r="28" fill="url(#emptySlot)" />
  <circle cx="540" cy="320" r="28" fill="url(#emptySlot)" />
  <circle cx="610" cy="320" r="28" fill="url(#emptySlot)" />

  <!-- Row 2 -->
  <circle cx="190" cy="260" r="28" fill="url(#emptySlot)" />
  <circle cx="260" cy="260" r="28" fill="url(#redToken)" filter="url(#tokenShadow)" />
  <circle cx="330" cy="260" r="28" fill="url(#emptySlot)" />
  <circle cx="400" cy="260" r="28" fill="url(#emptySlot)" />
  <circle cx="470" cy="260" r="28" fill="url(#emptySlot)" />
  <circle cx="540" cy="260" r="28" fill="url(#emptySlot)" />
  <circle cx="610" cy="260" r="28" fill="url(#emptySlot)" />

  <!-- Row 1 -->
  <circle cx="190" cy="200" r="28" fill="url(#emptySlot)" />
  <circle cx="260" cy="200" r="28" fill="url(#emptySlot)" />
  <circle cx="330" cy="200" r="28" fill="url(#emptySlot)" />
  <circle cx="400" cy="200" r="28" fill="url(#emptySlot)" />
  <circle cx="470" cy="200" r="28" fill="url(#emptySlot)" />
  <circle cx="540" cy="200" r="28" fill="url(#emptySlot)" />
  <circle cx="610" cy="200" r="28" fill="url(#emptySlot)" />

  <!-- Row 0 (Top) -->
  <circle cx="190" cy="140" r="28" fill="url(#emptySlot)" />
  <circle cx="260" cy="140" r="28" fill="url(#emptySlot)" />
  <circle cx="330" cy="140" r="28" fill="url(#emptySlot)" />
  <circle cx="400" cy="140" r="28" fill="url(#emptySlot)" />
  <circle cx="470" cy="140" r="28" fill="url(#emptySlot)" />
  <circle cx="540" cy="140" r="28" fill="url(#emptySlot)" />
  <circle cx="610" cy="140" r="28" fill="url(#emptySlot)" />

  <!-- Floating Falling Red Token with Motion Effect -->
  <g filter="url(#tokenShadow)">
    <circle cx="400" cy="54" r="30" fill="url(#redToken)" />
    <!-- Highlight Ring -->
    <circle cx="400" cy="54" r="22" fill="none" stroke="#fca5a5" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Side Floating Yellow Chip (Dynamic Depth) -->
  <g filter="url(#tokenShadow)" transform="rotate(-15 690 170)">
    <circle cx="690" cy="170" r="34" fill="url(#yellowToken)" />
    <circle cx="690" cy="170" r="25" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.7" />
  </g>
</svg>